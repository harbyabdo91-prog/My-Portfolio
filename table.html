<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTML Table</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <style>
    body { font-family: "Times New Roman", serif; }
    table { width: 360px; height: 340px; border: 2px solid #555; padding: 8px; }
    td { border: 1px solid #777; text-align: center; padding: 10px; }
    .green { background: green; }
    .red { color: red; }
  </style>
</head>
<body>
  <table>
    <tr>
      <td colspan="2"><b>name</b></td>
      <td rowspan="2"><b>Address</b></td>
    </tr>
    <tr>
      <td>First</td>
      <td>Last</td>
    </tr>
    <tr>
      <td colspan="3" class="green">All the data is here</td>
    </tr>
    <tr>
      <td colspan="2" rowspan="2">Hamada</td>
      <td class="red">cairo</td>
    </tr>
    <tr>
      <td>At vero eos et accusamus et iusto odio dignissimos ducimus qui blanditiis</td>
    </tr>
  </table>

  <h3>Clickable image example</h3>
  <a href="https://www.google.com" target="_blank" rel="noopener noreferrer">
    <img src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png"
         alt="Google" width="180">
  </a>
</body>
</html>
